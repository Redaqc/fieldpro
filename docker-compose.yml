version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: fieldpro-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fieldpro_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fieldpro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fieldpro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fieldpro-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: fieldpro-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - fieldpro-network

volumes:
  postgres_data:
  redis_data:

networks:
  fieldpro-network:
    driver: bridge
